services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODELFORGE_ENGINE: fixture
      MODELFORGE_LOG_INPUTS: "false"
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
