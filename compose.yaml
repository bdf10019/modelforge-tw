services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MODELFORGE_ENGINE: fixture
      MODELFORGE_LOG_INPUTS: "false"
      MODELFORGE_MAX_REQUEST_BODY_BYTES: "32768"
      MODELFORGE_QUEUE_TIMEOUT_SECONDS: "5"
      MODELFORGE_MAX_QUEUE_DEPTH: "8"
      MODELFORGE_SHUTDOWN_GRACE_SECONDS: "35"
      # Null means pass through only when the operator exports it; no value lives in this file.
      MODELFORGE_API_KEY:
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
