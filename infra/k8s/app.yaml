apiVersion: v1
kind: ConfigMap
metadata:
  name: modelforge-config
data:
  MODELFORGE_ENGINE: llama-http
  MODELFORGE_LLAMA_BASE_URL: http://llama-server:8080
  MODELFORGE_MODEL_ID: modelforge-tw-q8_0
  MODELFORGE_MODEL_VERSION: qwen3-1.7b-merged-v5-q8_0-json-schema-v2
  MODELFORGE_QUANTIZATION: q8_0
  MODELFORGE_REQUEST_TIMEOUT_SECONDS: "60"
  MODELFORGE_QUEUE_TIMEOUT_SECONDS: "5"
  MODELFORGE_SHUTDOWN_GRACE_SECONDS: "65"
  MODELFORGE_MAX_CONCURRENCY: "4"
  MODELFORGE_MAX_REQUEST_BODY_BYTES: "32768"
  MODELFORGE_CONTEXT_WINDOW_TOKENS: "2048"
  MODELFORGE_SAFETY_POLICY_VERSION: risk-precedence-v2
  MODELFORGE_LOG_INPUTS: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      containers:
        - name: llama-server
          # 正式環境應把 upstream tag 鎖成已掃描的 image digest。
          image: ghcr.io/ggml-org/llama.cpp:server-cuda13
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /models/modelforge-tw-q8_0.gguf
            - --alias
            - modelforge-tw-q8_0
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "8192"
            - --parallel
            - "4"
            - --n-gpu-layers
            - "99"
          ports:
            - name: model-http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: model-http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: model-http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 3Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 6Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: modelforge-models
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
spec:
  selector:
    app: llama-server
  ports:
    - name: model-http
      port: 8080
      targetPort: model-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelforge-api
  template:
    metadata:
      labels:
        app: modelforge-api
    spec:
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: modelforge-tw:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: modelforge-config
          env:
            - name: MODELFORGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: modelforge-api-auth
                  key: api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: modelforge-api
spec:
  selector:
    app: modelforge-api
  ports:
    - name: http
      port: 80
      targetPort: http
