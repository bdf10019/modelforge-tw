apiVersion: batch/v1
kind: Job
metadata:
  name: modelforge-train
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          image: modelforge-tw-gpu:0.1.0
          command: ["/bin/sh", "-lc"]
          args:
            - >-
              modelforge generate-data --output /app/data/generated
              --challenge /app/data/source/challenge.jsonl &&
              modelforge train --config /app/configs/training.json
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HF_HOME
              value: /cache/huggingface
            - name: XDG_CACHE_HOME
              value: /cache
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /app/artifacts
            - name: generated-data
              mountPath: /app/data/generated
            - name: cache
              mountPath: /cache
            - name: temporary
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: modelforge-artifacts
        - name: generated-data
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: temporary
          emptyDir: {}
